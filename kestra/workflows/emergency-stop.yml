id: emergency-stop-overmind
namespace: operations.overmind
description: "Emergency stop for THE OVERMIND PROTOCOL"
inputs:
  - name: stop_type
    type: STRING
    default: soft
    description: "Stop type (soft/hard) - soft stops new trades, hard stops entire system"

tasks:
  - id: emergency-stop
    type: io.kestra.plugin.core.script.Shell
    commands:
      - echo "EMERGENCY STOP ACTIVATED - {{inputs.stop_type}} stop"
      - |
        if [ "{{inputs.stop_type}}" = "soft" ]; then
          echo "Activating soft stop (no new trades)"
          curl -X POST http://localhost:8000/control/emergency-stop
        else
          echo "Activating hard stop (shutting down system)"
          cd /opt/overmind && docker-compose -f docker-compose.overmind.yml down
        fi
      
  - id: notify-admin
    type: io.kestra.plugin.core.script.Shell
    commands:
      - echo "Sending emergency notification to admin"
      - |
        curl -X POST -H "Content-Type: application/json" \
          -d '{"text":"⚠️ EMERGENCY: THE OVERMIND PROTOCOL {{inputs.stop_type}} stop activated"}' \
          https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK