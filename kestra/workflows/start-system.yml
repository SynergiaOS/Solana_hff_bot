id: start-overmind-protocol
namespace: operations.overmind
description: "Start THE OVERMIND PROTOCOL trading system"
inputs:
  - name: trading_mode
    type: STRING
    default: paper
    description: "Trading mode (paper/live)"
  - name: ai_mode
    type: STRING
    default: enabled
    description: "AI mode (enabled/disabled)"

tasks:
  - id: check-prerequisites
    type: io.kestra.plugin.core.script.Shell
    commands:
      - echo "Checking system prerequisites..."
      - docker ps > /dev/null || (echo "Docker not running" && exit 1)
      - test -f /opt/overmind/docker-compose.overmind.yml || (echo "Docker compose file not found" && exit 1)
    
  - id: start-docker-compose
    type: io.kestra.plugin.core.script.Shell
    commands:
      - echo "Starting THE OVERMIND PROTOCOL in {{inputs.trading_mode}} mode with AI {{inputs.ai_mode}}"
      - cd /opt/overmind && SNIPER_TRADING_MODE={{inputs.trading_mode}} OVERMIND_AI_MODE={{inputs.ai_mode}} docker-compose -f docker-compose.overmind.yml up -d
    
  - id: verify-startup
    type: io.kestra.plugin.core.script.Shell
    commands:
      - echo "Verifying system startup..."
      - sleep 10
      - curl -s http://localhost:8000/health | grep -q "healthy" || (echo "AI Brain not healthy" && exit 1)
      - curl -s http://localhost:8080/health | grep -q "healthy" || (echo "Rust executor not healthy" && exit 1)
      - echo "THE OVERMIND PROTOCOL successfully started"