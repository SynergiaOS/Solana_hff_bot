global:
  evaluation_interval: 15s
  scrape_interval: 15s
rule_files:
- alerting_rules.yml
scrape_configs:
- job_name: research-agent
  metrics_path: /metrics
  scrape_interval: 10s
  static_configs:
  - targets:
    - localhost:9090
- job_name: redis
  static_configs:
  - targets:
    - localhost:6380
