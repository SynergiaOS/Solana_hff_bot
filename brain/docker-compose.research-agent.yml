# THE OVERMIND PROTOCOL - ResearchAgent Microservice Docker Compose
# Scalable deployment configuration for ResearchAgent with Jina-Serve

version: '3.8'

services:
  research-agent:
    build:
      context: .
      dockerfile: Dockerfile.research-agent
    container_name: overmind-research-agent
    ports:
      - "8080:8080"  # HTTP API
      - "9090:9090"  # Monitoring
    environment:
      - JINA_LOG_LEVEL=INFO
      - OVERMIND_RESEARCH_MODE=production
      - JINA_API_KEY=jina_72cc7ed00e21496290ed9e018d56de3bETDGPqW-TUXuYYIxk4jwHLN9h0C6
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    depends_on:
      - redis
    networks:
      - overmind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
  
  # Load balancer for multiple ResearchAgent instances
  research-agent-lb:
    image: nginx:alpine
    container_name: overmind-research-lb
    ports:
      - "8081:80"
    volumes:
      - ./nginx.research-agent.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - research-agent
    networks:
      - overmind-network
    restart: unless-stopped
  
  # Redis for caching and communication
  redis:
    image: redis:7-alpine
    container_name: overmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - overmind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: overmind-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - overmind-network
    restart: unless-stopped
  
  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: overmind-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=overmind123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - overmind-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  overmind-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
