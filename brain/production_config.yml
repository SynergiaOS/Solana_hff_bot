research_agent:
  environment: production
  health_check:
    endpoint: /health
    interval: 30
    retries: 3
    timeout: 10
  image_name: overmind/research-agent:latest
  monitoring_port: 9090
  port: 8080
  replicas: 3
  resources:
    cpu: '1'
    memory: 2Gi
  scaling:
    max_replicas: 10
    min_replicas: 2
    target_cpu_utilization: 70
  service_name: overmind-research-agent
