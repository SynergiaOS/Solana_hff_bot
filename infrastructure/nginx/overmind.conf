# THE OVERMIND PROTOCOL Nginx Configuration
# Updated with Mission Control Dashboard support

upstream overmind_api {
    server 127.0.0.1:8080;
}

upstream grafana {
    server 127.0.0.1:3000;
}

upstream tensorzero {
    server 127.0.0.1:3003;
}

upstream mission_control {
    server 127.0.0.1:8501;
}

server {
    listen 8090;
    server_name overmind.local;
    
    # Mission Control Dashboard
    location /mission-control/ {
        proxy_pass http://mission_control/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Streamlit specific headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support for Streamlit
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
    
    # Main API
    location /api/ {
        proxy_pass http://overmind_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Metrics
    location /metrics {
        proxy_pass http://overmind_api/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Grafana Dashboard
    location /grafana/ {
        proxy_pass http://grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # TensorZero AI Gateway
    location /ai/ {
        proxy_pass http://tensorzero/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Default location - redirect to Mission Control
    location / {
        return 302 /mission-control/;
    }
    
    # Health check endpoint
    location /health {
        return 200 'THE OVERMIND PROTOCOL - All Systems Operational';
        add_header Content-Type text/plain;
    }
}
