id: start-overmind-system
namespace: operations.overmind

description: |
  🚀 THE OVERMIND PROTOCOL - System Startup
  Starts the complete 5-layer autonomous AI trading system

labels:
  system: overmind
  priority: critical
  environment: "{{ vars.environment | default('devnet') }}"

inputs:
  - id: environment
    type: SELECT
    displayName: Environment
    description: Target environment for deployment
    defaults: devnet
    values:
      - devnet
      - mainnet
    required: true

  - id: trading_mode
    type: SELECT
    displayName: Trading Mode
    description: Trading mode (paper or live)
    defaults: paper
    values:
      - paper
      - live
    required: true

variables:
  compose_file: "{{ inputs.environment == 'devnet' ? 'docker-compose.devnet.yml' : 'docker-compose.overmind.yml' }}"
  project_path: "/opt/overmind"

tasks:
  - id: validate-environment
    type: io.kestra.plugin.core.script.Shell
    description: Validate environment and prerequisites
    commands:
      - echo "🔍 Validating environment: {{ inputs.environment }}"
      - echo "🎯 Trading mode: {{ inputs.trading_mode }}"
      - cd {{ vars.project_path }}
      - ls -la {{ vars.compose_file }}
      - docker --version
      - docker-compose --version

  - id: check-system-status
    type: io.kestra.plugin.core.script.Shell
    description: Check if system is already running
    commands:
      - cd {{ vars.project_path }}
      - docker-compose -f {{ vars.compose_file }} ps

  - id: start-infrastructure
    type: io.kestra.plugin.core.script.Shell
    description: Start THE OVERMIND PROTOCOL infrastructure
    commands:
      - echo "🚀 Starting THE OVERMIND PROTOCOL infrastructure..."
      - cd {{ vars.project_path }}
      - export SNIPER_TRADING_MODE={{ inputs.trading_mode }}
      - export SNIPER_ENVIRONMENT={{ inputs.environment }}
      - docker-compose -f {{ vars.compose_file }} up -d --remove-orphans
      - echo "✅ Infrastructure started"

  - id: wait-for-services
    type: io.kestra.plugin.core.script.Shell
    description: Wait for services to become healthy
    commands:
      - echo "⏳ Waiting for services to initialize..."
      - sleep 30
      - echo "🔍 Checking service health..."

  - id: verify-health
    type: io.kestra.plugin.core.script.Shell
    description: Verify system health
    commands:
      - echo "🏥 Verifying system health..."
      - cd {{ vars.project_path }}
      - docker-compose -f {{ vars.compose_file }} ps
      - echo "🧠 Checking AI Brain..."
      - curl -f http://localhost:8000/health || echo "⚠️ AI Brain not ready"
      - echo "⚡ Checking Rust Executor..."
      - curl -f http://localhost:8080/health || echo "⚠️ Rust Executor not ready"
      - echo "🗄️ Checking DragonflyDB..."
      - docker exec overmind-dragonfly-{{ inputs.environment }} redis-cli ping || echo "⚠️ DragonflyDB not ready"

  - id: display-endpoints
    type: io.kestra.plugin.core.script.Shell
    description: Display available endpoints
    commands:
      - echo "🌐 THE OVERMIND PROTOCOL ENDPOINTS:"
      - echo "   • AI Brain API:        http://localhost:8000"
      - echo "   • Rust Executor API:   http://localhost:8080"
      - echo "   • Vector Database:     http://localhost:8001"
      - echo "   • TensorZero Gateway:  http://localhost:3001"
      - echo "   • Grafana Dashboard:   http://localhost:3000"
      - echo ""
      - echo "📊 MONITORING COMMANDS:"
      - echo "   docker-compose -f {{ vars.compose_file }} logs -f"
      - echo "   curl http://localhost:8000/status"
      - echo "   curl http://localhost:8080/metrics"

triggers:
  - id: manual-trigger
    type: io.kestra.plugin.core.trigger.Manual
    description: Manual system startup trigger
