id: mainnet-paper-trading
namespace: overmind.trading

description: |
  THE OVERMIND PROTOCOL - Mainnet Paper Trading
  Automated paper trading workflow on Solana Mainnet
  
  This flow:
  1. Validates Mainnet configuration and API connectivity
  2. Starts THE OVERMIND PROTOCOL stack in paper trading mode
  3. Monitors system performance and AI decisions
  4. Generates real-time reports and alerts
  5. Provides emergency stop capabilities

labels:
  project: overmind-protocol
  type: paper-trading
  environment: production
  network: mainnet

inputs:
  - id: duration_hours
    type: INT
    defaults: 24
    description: "Duration to run paper trading (hours)"
  
  - id: max_position_size
    type: FLOAT
    defaults: 0.1
    description: "Maximum position size (SOL)"
  
  - id: monitoring_interval
    type: INT
    defaults: 300
    description: "Monitoring interval (seconds)"
  
  - id: notification_email
    type: STRING
    defaults: "admin@overmind-protocol.com"
    description: "Email for alerts and reports"

variables:
  app_env: "production"
  workspace_path: "/workspace"
  docker_compose_file: "docker-compose.overmind.yml"

tasks:
  # Task 1: Pre-flight Validation
  - id: preflight-validation
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Validate Mainnet configuration and prerequisites"
    commands:
      - echo "🚀 THE OVERMIND PROTOCOL - Mainnet Paper Trading"
      - echo "Duration 24 hours"
      - echo "Max position 0.1 SOL"
      - cd /workspace
      - export APP_ENV=production
      - export PAPER_TRADING_MODE=true
      - export SNIPER_TRADING_MODE=paper
      - export SNIPER_MAX_POSITION_SIZE={{ inputs.max_position_size }}
      - echo "✅ Environment variables configured"
      - |
        # Validate Mainnet endpoints are configured
        if [ -z "$QUICKNODE_MAINNET_RPC_URL" ] || [[ "$QUICKNODE_MAINNET_RPC_URL" == *"your-mainnet-endpoint"* ]]; then
          echo "❌ Mainnet QuickNode endpoint not configured"
          echo "Please configure QUICKNODE_MAINNET_RPC_URL in .env"
          exit 1
        fi
      - echo "✅ Mainnet endpoints validated"
    workingDir: "{{ vars.workspace_path }}"

  # Task 2: Configuration Validation
  - id: validate-mainnet-config
    type: io.kestra.plugin.scripts.python.Script
    description: "Validate Mainnet configuration system"
    beforeCommands:
      - cd {{ vars.workspace_path }}
      - export APP_ENV={{ vars.app_env }}
      - export PAPER_TRADING_MODE=true
    script: |
      import sys
      import os
      
      # Add config to path
      sys.path.insert(0, 'config')
      
      from environment_loader import initialize_environment
      
      print("🔍 Validating Mainnet configuration...")
      
      # Initialize environment
      loader = initialize_environment()
      status = loader.get_status_report()
      
      print(f"Environment: {status['environment']}")
      print(f"Network: {status['network']}")
      print(f"Is Mainnet: {status['is_mainnet']}")
      print(f"Trading mode: {status['trading_mode']}")
      print(f"Paper trading: {status['paper_trading']}")
      
      # Validate Mainnet requirements
      if not status['is_mainnet']:
          raise Exception("Expected Mainnet configuration, got Devnet")
      
      if not status['paper_trading']:
          raise Exception("Paper trading must be enabled for safety")
      
      if not status['all_valid']:
          print("❌ Configuration issues:")
          for warning in status['warnings']:
              print(f"  - {warning}")
          raise Exception("Invalid Mainnet configuration")
      
      print("✅ Mainnet configuration validated")
    workingDir: "{{ vars.workspace_path }}"

  # Task 3: API Connectivity Test
  - id: test-mainnet-apis
    type: io.kestra.plugin.scripts.python.Script
    description: "Test Mainnet API connectivity"
    beforeCommands:
      - cd {{ vars.workspace_path }}
      - export APP_ENV={{ vars.app_env }}
    script: |
      import sys
      import os
      import asyncio
      import aiohttp
      
      async def test_mainnet_connectivity():
          print("🌐 Testing Mainnet API connectivity...")
          
          # Test QuickNode Mainnet
          quicknode_url = os.getenv('QUICKNODE_MAINNET_RPC_URL')
          if not quicknode_url:
              raise Exception("QuickNode Mainnet URL not configured")
          
          async with aiohttp.ClientSession() as session:
              # Test RPC call
              payload = {
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "getVersion"
              }
              
              async with session.post(quicknode_url, json=payload) as response:
                  if response.status != 200:
                      raise Exception(f"QuickNode Mainnet API error: {response.status}")
                  
                  data = await response.json()
                  if 'result' not in data:
                      raise Exception("Invalid QuickNode response")
                  
                  print(f"✅ QuickNode Mainnet: {data['result']['solana-core']}")
          
          # Test Helius Mainnet
          helius_url = os.getenv('HELIUS_MAINNET_RPC_URL')
          if helius_url:
              async with aiohttp.ClientSession() as session:
                  async with session.post(helius_url, json=payload) as response:
                      if response.status == 200:
                          print("✅ Helius Mainnet: Connected")
                      else:
                          print(f"⚠️ Helius Mainnet: {response.status}")
          
          print("✅ Mainnet API connectivity validated")
      
      asyncio.run(test_mainnet_connectivity())
    workingDir: "{{ vars.workspace_path }}"

  # Task 4: Start OVERMIND Stack
  - id: start-overmind-stack
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Start THE OVERMIND PROTOCOL stack"
    commands:
      - cd /workspace
      - export APP_ENV=production
      - export PAPER_TRADING_MODE=true
      - export SNIPER_TRADING_MODE=paper
      - export SNIPER_MAX_POSITION_SIZE=0.1
      - echo "🚀 Starting THE OVERMIND PROTOCOL stack..."
      - docker-compose -f docker-compose.overmind.yml up -d
      - echo "⏳ Waiting for services to start..."
      - sleep 30
      - echo "✅ OVERMIND stack started"
      - docker-compose -f docker-compose.overmind.yml ps
    workingDir: "{{ vars.workspace_path }}"

  # Task 5: Health Check
  - id: health-check
    type: io.kestra.plugin.scripts.python.Script
    description: "Verify all OVERMIND services are healthy"
    beforeCommands:
      - cd {{ vars.workspace_path }}
    script: |
      import asyncio
      import aiohttp
      import time
      
      async def check_service_health():
          print("🏥 Checking OVERMIND service health...")
          
          services = [
              ("AI Brain", "http://localhost:8000/health"),
              ("Rust Executor", "http://localhost:8080/health"),
              ("DragonflyDB", "http://localhost:6379"),  # Redis protocol
              ("Mission Control", "http://localhost:8501")
          ]
          
          healthy_services = 0
          
          async with aiohttp.ClientSession() as session:
              for name, url in services:
                  try:
                      if "6379" in url:  # DragonflyDB check
                          # Simple TCP connection check for Redis
                          import socket
                          sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                          result = sock.connect_ex(('localhost', 6379))
                          sock.close()
                          if result == 0:
                              print(f"✅ {name}: Healthy")
                              healthy_services += 1
                          else:
                              print(f"❌ {name}: Not responding")
                      else:
                          async with session.get(url, timeout=10) as response:
                              if response.status == 200:
                                  print(f"✅ {name}: Healthy")
                                  healthy_services += 1
                              else:
                                  print(f"⚠️ {name}: Status {response.status}")
                  except Exception as e:
                      print(f"❌ {name}: {str(e)}")
          
          print(f"Health check: {healthy_services}/{len(services)} services healthy")
          
          if healthy_services < len(services) // 2:
              raise Exception("Too many services unhealthy")
          
          print("✅ System health check passed")
      
      asyncio.run(check_service_health())
    workingDir: "{{ vars.workspace_path }}"

  # Task 6: Monitor Trading Session
  - id: monitor-trading
    type: io.kestra.plugin.scripts.python.Script
    description: "Monitor paper trading session"
    timeout: "PT{{ inputs.duration_hours }}H"
    beforeCommands:
      - cd {{ vars.workspace_path }}
      - export APP_ENV={{ vars.app_env }}
    script: |
      import asyncio
      import time
      import json
      from datetime import datetime, timedelta
      
      async def monitor_session():
          print("📊 Starting trading session monitoring...")
          
          duration_seconds = {{ inputs.duration_hours }} * 3600
          monitoring_interval = {{ inputs.monitoring_interval }}
          end_time = time.time() + duration_seconds
          
          session_data = {
              'start_time': datetime.now().isoformat(),
              'duration_hours': {{ inputs.duration_hours }},
              'max_position_size': {{ inputs.max_position_size }},
              'monitoring_logs': []
          }
          
          while time.time() < end_time:
              current_time = datetime.now()
              print(f"📈 Monitoring check: {current_time.strftime('%H:%M:%S')}")
              
              # Collect metrics (simplified for demo)
              metrics = {
                  'timestamp': current_time.isoformat(),
                  'uptime_hours': (time.time() - (end_time - duration_seconds)) / 3600,
                  'status': 'running'
              }
              
              session_data['monitoring_logs'].append(metrics)
              
              # Save session data
              with open('/tmp/trading_session.json', 'w') as f:
                  json.dump(session_data, f, indent=2)
              
              print(f"⏰ Session running: {metrics['uptime_hours']:.1f}h / {{ inputs.duration_hours }}h")
              
              await asyncio.sleep(monitoring_interval)
          
          session_data['end_time'] = datetime.now().isoformat()
          session_data['status'] = 'completed'
          
          with open('/tmp/trading_session.json', 'w') as f:
              json.dump(session_data, f, indent=2)
          
          print("✅ Trading session monitoring completed")
      
      asyncio.run(monitor_session())
    workingDir: "{{ vars.workspace_path }}"
    outputs:
      - id: session_data
        type: FILE
        from: "/tmp/trading_session.json"

  # Task 7: Generate Session Report
  - id: generate-session-report
    type: io.kestra.plugin.scripts.python.Script
    description: "Generate paper trading session report"
    beforeCommands:
      - cd {{ vars.workspace_path }}
    script: |
      import json
      from datetime import datetime
      
      # Load session data
      with open('/tmp/trading_session.json', 'r') as f:
          session = json.load(f)
      
      # Generate report
      html_report = f"""
      <!DOCTYPE html>
      <html>
      <head>
          <title>THE OVERMIND PROTOCOL - Paper Trading Report</title>
          <style>
              body {{ font-family: Arial, sans-serif; margin: 20px; }}
              .header {{ background: #1e3a8a; color: white; padding: 20px; border-radius: 8px; }}
              .summary {{ background: #f3f4f6; padding: 15px; margin: 20px 0; border-radius: 8px; }}
              .success {{ color: #059669; }}
              .warning {{ color: #d97706; }}
          </style>
      </head>
      <body>
          <div class="header">
              <h1>🧠 THE OVERMIND PROTOCOL</h1>
              <h2>Mainnet Paper Trading Session Report</h2>
              <p>Generated: {datetime.now().isoformat()}</p>
          </div>
          
          <div class="summary">
              <h3>📊 Session Summary</h3>
              <p><strong>Start Time:</strong> {session['start_time']}</p>
              <p><strong>End Time:</strong> {session.get('end_time', 'In Progress')}</p>
              <p><strong>Duration:</strong> {session['duration_hours']} hours</p>
              <p><strong>Max Position Size:</strong> {session['max_position_size']} SOL</p>
              <p><strong>Status:</strong> <span class="success">{session.get('status', 'running').upper()}</span></p>
              <p><strong>Monitoring Checks:</strong> {len(session['monitoring_logs'])}</p>
          </div>
          
          <h3>📈 Monitoring Timeline</h3>
          <ul>
      """
      
      for log in session['monitoring_logs'][-10:]:  # Last 10 entries
          html_report += f"<li>{log['timestamp']}: Uptime {log['uptime_hours']:.1f}h - {log['status']}</li>"
      
      html_report += """
          </ul>
          
          <div class="summary">
              <h3>✅ Session Completed Successfully</h3>
              <p>The paper trading session has completed without critical errors.</p>
              <p>All monitoring checks passed during the session duration.</p>
          </div>
      </body>
      </html>
      """
      
      with open('/tmp/session_report.html', 'w') as f:
          f.write(html_report)
      
      print("✅ Session report generated")
    workingDir: "{{ vars.workspace_path }}"
    outputs:
      - id: session_report
        type: FILE
        from: "/tmp/session_report.html"

  # Task 8: Cleanup
  - id: cleanup-stack
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Stop OVERMIND stack after session"
    commands:
      - cd {{ vars.workspace_path }}
      - echo "🛑 Stopping THE OVERMIND PROTOCOL stack..."
      - docker-compose -f docker-compose.overmind.yml down
      - echo "✅ Stack stopped successfully"
    workingDir: "{{ vars.workspace_path }}"

  # Task 9: Final Notification
  - id: session-complete-notification
    type: io.kestra.plugin.notifications.mail.MailSend
    description: "Send session completion notification"
    from: "overmind-protocol@localhost"
    to: ["{{ inputs.notification_email }}"]
    subject: "THE OVERMIND PROTOCOL - Paper Trading Session Completed"
    htmlTextContent: |
      <h2>🧠 THE OVERMIND PROTOCOL</h2>
      <h3>Mainnet Paper Trading Session Completed</h3>
      
      <p><strong>Duration:</strong> {{ inputs.duration_hours }} hours</p>
      <p><strong>Max Position:</strong> {{ inputs.max_position_size }} SOL</p>
      <p><strong>Completed:</strong> {{ execution.endDate }}</p>
      
      <p>The paper trading session has completed successfully.</p>
      <p>Please review the attached reports for detailed analysis.</p>
      
      <p><em>THE OVERMIND PROTOCOL - Ready for the next phase</em></p>
    attachments:
      - name: "trading_session.json"
        uri: "{{ outputs.monitor-trading.session_data }}"
      - name: "session_report.html"
        uri: "{{ outputs.generate-session-report.session_report }}"

# Manual trigger only for safety
triggers: []
