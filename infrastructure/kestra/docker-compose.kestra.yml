version: "3.8"

# THE OVERMIND PROTOCOL - Kestra Orchestration
# Professional workflow orchestration for THE OVERMIND PROTOCOL
# Replaces manual scripts with automated, monitored workflows

services:
  # PostgreSQL Database for Kestra
  kestra-postgres:
    image: postgres:15
    container_name: overmind-kestra-postgres
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra_secure_password_2024
    volumes:
      - kestra_postgres_data:/var/lib/postgresql/data
    networks:
      - overmind-kestra
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kestra Server
  kestra:
    image: kestra/kestra:latest
    container_name: overmind-kestra
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: kestra_secure_password_2024
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
    volumes:
      - kestra_data:/app/storage
      - kestra_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./flows:/app/flows
      - ../..:/workspace:ro  # Mount project root as read-only
    networks:
      - overmind-kestra
      - overmind-network  # Connect to main OVERMIND network
    depends_on:
      kestra-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kestra Worker (for executing tasks)
  kestra-worker:
    image: kestra/kestra:latest
    container_name: overmind-kestra-worker
    command: ["./kestra", "worker", "--worker-group=overmind"]
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: kestra_secure_password_2024
        kestra:
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
    volumes:
      - kestra_data:/app/storage
      - kestra_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/workspace:ro  # Mount project root as read-only
    networks:
      - overmind-kestra
      - overmind-network
    depends_on:
      kestra:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kestra_postgres_data:
    driver: local
  kestra_data:
    driver: local
  kestra_logs:
    driver: local

networks:
  overmind-kestra:
    driver: bridge
  overmind-network:
    external: true  # Connect to existing OVERMIND network
