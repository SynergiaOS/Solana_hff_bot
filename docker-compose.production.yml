version: '3.8'

# THE OVERMIND PROTOCOL - Production Docker Compose
# Optimized for VDS 32GB RAM, 8 CPU cores

services:
  # DragonflyDB - High-Performance Redis-compatible database
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: overmind-dragonfly-prod
    ports:
      - "6379:6379"
    command: >
      dragonfly 
      --logtostderr 
      --maxmemory=8gb 
      --save_schedule="*/30 */6 */1"
      --threads=8
      --tcp_keepalive=300
    volumes:
      - dragonfly_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '4.0'
        reservations:
          memory: 8G
          cpus: '2.0'

  # PostgreSQL - Production database
  postgres:
    image: postgres:15-alpine
    container_name: overmind-postgres-prod
    environment:
      POSTGRES_DB: overmind_production
      POSTGRES_USER: overmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_production_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: overmind-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # Grafana - Monitoring dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: overmind-grafana-prod
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-secure_production_password}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # TensorZero - AI Optimization (Production)
  tensorzero:
    image: tensorzero/tensorzero:latest
    container_name: overmind-tensorzero-prod
    ports:
      - "3001:3000"
    environment:
      - TENSORZERO_API_KEY=${TENSORZERO_API_KEY}
      - TENSORZERO_MODE=production
    volumes:
      - tensorzero_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ChromaDB - Vector database for AI memory
  chromadb:
    image: chromadb/chroma:latest
    container_name: overmind-chromadb-prod
    ports:
      - "8000:8000"
    environment:
      - CHROMA_HOST=0.0.0.0
      - CHROMA_PORT=8000
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # Nginx - Reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: overmind-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - dragonfly
      - prometheus
      - grafana
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Log aggregation with Loki
  loki:
    image: grafana/loki:latest
    container_name: overmind-loki-prod
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Process monitoring with Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: overmind-node-exporter-prod
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

volumes:
  dragonfly_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tensorzero_data:
    driver: local
  chroma_data:
    driver: local
  nginx_logs:
    driver: local
  loki_data:
    driver: local

networks:
  default:
    name: overmind-production
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16