# THE OVERMIND PROTOCOL - Prometheus Configuration (FIXED)
# Comprehensive monitoring for AI-enhanced HFT trading system

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'overmind-protocol'
    environment: 'production'

# Scrape configurations
scrape_configs:
  # THE OVERMIND PROTOCOL - Main Trading System (v2.0) - REAL DATA
  - job_name: 'overmind-brain'
    static_configs:
      - targets: ['172.17.0.1:9092']  # Docker bridge network
    metrics_path: '/metrics'
    scrape_interval: 5s  # High frequency for trading metrics
    scrape_timeout: 4s

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # System Metrics - Node Exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['89.117.53.53:9100']
    scrape_interval: 15s